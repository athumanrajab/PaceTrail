    <title>PaceTrail</title>
  </head>
  <body>
    <div class="sidebar">
      <img src="logo-1.png" alt="Logo" class="logo" />
      <div class="workouts__toolbar" hidden>
        <label class="workouts__sort-label" for="workouts-sort-field">
          Sort by
        </label>
        <select class="workouts__sort" id="workouts-sort-field">
          <option value="date">Date</option>
          <option value="distance">Distance</option>
          <option value="duration">Duration</option>
          <option value="type">Workout type</option>
        </select>
        <select class="workouts__sort-direction" aria-label="Sort direction">
          <option value="desc">Descending</option>
          <option value="asc">Ascending</option>
        </select>
        <button class="workouts__clear" type="button">
          Delete all workouts
        </button>
      </div>
      <p class="app-feedback" role="status" aria-live="polite" hidden></p>

      <ul class="workouts">
        <form class="form hidden">
          <div class="form__row">
            <label class="form__label" for="workout-type">Type</label>
            <select class="form__input form__input--type" id="workout-type">
              <option value="running">Running</option>
              <option value="cycling">Cycling</option>
            </select>
          </div>
          <div class="form__row">
            <label class="form__label" for="workout-distance">Distance</label>
            <input class="form__input form__input--distance" id="workout-distance" type="number" min="0" step="any" placeholder="km" />
          </div>
          <div class="form__row">
            <label class="form__label" for="workout-duration">Duration</label>
            <input
              class="form__input form__input--duration"
              id="workout-duration"
              type="number"
              min="0"
              step="any"
              placeholder="min"
            />
          </div>
          <div class="form__row">
            <label class="form__label" for="workout-cadence">Cadence</label>
            <input
              class="form__input form__input--cadence"
              id="workout-cadence"
              type="number"
              min="0"
              step="any"
              placeholder="step/min"
            />
          </div>
          <div class="form__row form__row--hidden">
            <label class="form__label" for="workout-elevation">Elev Gain</label>
            <input
              class="form__input form__input--elevation"
              id="workout-elevation"
              type="number"
              min="0"
              step="any"
              placeholder="meters"
            />
          </div>
          <div class="form__actions">
            <button class="form__btn" type="submit">Save workout</button>
            <button class="form__cancel" type="button">Cancel</button>
          </div>
          <p class="form__error" role="alert" hidden></p>
        </form>
